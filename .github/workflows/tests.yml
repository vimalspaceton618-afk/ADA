name: ADA tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,yaml]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile ADA subsystems
        run: python -m compileall -q 06_COGNITION 07_WORLD_MODEL 08_LEARNING 09_NEURAL_SUBSTRATE 10_DEVELOPMENT_ENGINE 11_REASONING_AND_PLANNING 12_ACTION_SYSTEM 13_EXTERNAL_KNOWLEDGE 14_EVALUATION ada

  neural-world-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install base test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,yaml]"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run world-model research tests
        run: python -m pytest -q tests/test_world_model_research.py tests/test_world_model_neural.py tests/test_learning_pytorch_adapter.py tests/test_ssd_reference.py tests/test_mamba2_reference.py tests/test_decoder_block.py tests/test_modeling_ada.py
      - name: Compile neural and world-model packages
        run: python -m compileall -q 07_WORLD_MODEL 09_NEURAL_SUBSTRATE ada/world_model ada/neural
