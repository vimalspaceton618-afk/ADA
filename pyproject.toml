[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-intelligence"
version = "0.1.0"
description = "Research scaffold for adaptive intelligence systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ADA contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.24"]
yaml = ["PyYAML>=6"]
neural = ["torch>=2.2"]
perception-vision = ["torch>=2.2", "transformers>=4.44", "Pillow>=10", "safetensors>=0.4"]
perception-audio = ["torch>=2.2", "transformers>=4.44", "numpy>=1.24", "soundfile>=0.12", "scipy>=1.11", "safetensors>=0.4"]
perception-video = ["av>=12.0", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["ada*", "02_CORE_RUNTIME*", "03_PERCEPTION*", "04_REPRESENTATION*", "05_MEMORY*", "06_COGNITION*", "07_WORLD_MODEL*", "08_LEARNING*", "09_NEURAL_SUBSTRATE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
