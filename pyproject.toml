[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-intelligence"
version = "0.1.0"
description = "Research scaffold for adaptive intelligence systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ADA contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
yaml = ["PyYAML>=6"]
neural = ["torch>=2.2"]
perception-vision = ["torch>=2.2", "transformers>=4.44", "Pillow>=10", "safetensors>=0.4"]
perception-audio = ["torch>=2.2", "transformers>=4.44", "soundfile>=0.12", "scipy>=1.11", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["ada*", "02_CORE_RUNTIME*", "03_PERCEPTION*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
