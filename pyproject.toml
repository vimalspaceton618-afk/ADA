[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-intelligence"
version = "0.1.0"
description = "Research scaffold for adaptive intelligence systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ADA contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
yaml = ["PyYAML>=6"]
neural = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["ada*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
