[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-intelligence"
version = "0.1.0"
description = "Research scaffold for adaptive intelligence systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ADA contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.24"]
yaml = ["PyYAML>=6"]
neural = ["torch>=2.2"]
pretraining = ["torch>=2.2", "datasets>=3.0", "tokenizers>=0.20"]
perception-vision = ["torch>=2.2", "transformers>=4.44", "Pillow>=10", "safetensors>=0.4"]
perception-audio = ["torch>=2.2", "transformers>=4.44", "numpy>=1.24", "soundfile>=0.12", "scipy>=1.11", "safetensors>=0.4"]
perception-video = ["av>=12.0", "Pillow>=10"]

[tool.setuptools.packages.find]
include = [
  "ada*",
  "02_CORE_RUNTIME*", "03_PERCEPTION*", "04_REPRESENTATION*", "05_MEMORY*",
  "06_COGNITION*", "07_WORLD_MODEL*", "08_LEARNING*", "09_NEURAL_SUBSTRATE*",
  "10_DEVELOPMENT_ENGINE*", "11_REASONING_AND_PLANNING*", "12_ACTION_SYSTEM*",
  "13_EXTERNAL_KNOWLEDGE*", "14_EVALUATION*", "15_SAFETY_AND_GOVERNANCE*", "16_DATA_INFRASTRUCTURE*", "17_TRAINING*", "18_INFERENCE*", "19_INTERACTION*", "20_DISTRIBUTED_INFRASTRUCTURE*", "21_OBSERVABILITY*", "22_INTEROPERABILITY*", "23_DEPLOYMENT*", "24_TESTING*", "25_RESEARCH*", "26_DOCUMENTATION*", "27_OPERATIONS*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
