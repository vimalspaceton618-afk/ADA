[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-intelligence"
version = "0.1.0"
description = "Research scaffold for adaptive intelligence systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ADA contributors" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["ada*"]
